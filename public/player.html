<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player — Nebeltisch</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="player">
  <main id="canvas-area"></main>
  <!-- Shown while nothing is presented. The GM's mirror of this state is #live-lamp in gm.html. -->
  <div id="waiting-screen" hidden>
    <canvas id="waiting-veil"></canvas>
    <div id="waiting-content">
      <h1 id="waiting-title"></h1>
      <p id="waiting-note">The fog has not lifted yet.</p>
    </div>
  </div>
  <div id="player-badge" class="floating-control">
    <span id="player-info"></span>
  </div>
  <script type="module" src="/dist/player.js"></script>
</body>
</html>
