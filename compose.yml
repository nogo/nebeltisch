services:
  nebeltisch:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - nebeltisch-data:/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  nebeltisch-data:
